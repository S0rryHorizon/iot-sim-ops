
name: CI
on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/mock-fastapi/requirements.txt
            api/mock-fastapi/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r api/mock-fastapi/requirements.txt \
            -r api/mock-fastapi/requirements-dev.txt
      - name: Compile and test
        run: |
          python -m compileall -q api/mock-fastapi
          python -m pytest -q tests/test_app.py

  db-migrate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: iot_sim_ops
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot || exit 1"
          --health-interval=10s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            if mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Initialize empty demo database from historical migrations
        run: |
          mysql -h 127.0.0.1 -uroot -proot < db/schema.sql
          mysql -h 127.0.0.1 -uroot -proot < db/seed.sql
      - name: Sanity checks
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "SELECT COUNT(*) 'sim_cards' FROM iot_sim_ops.sim_card;"
          mysql -h 127.0.0.1 -uroot -proot -e "SELECT COUNT(*) 'users' FROM iot_sim_ops.user_account;"
          mysql -h 127.0.0.1 -uroot -proot -e "SHOW COLUMNS FROM iot_sim_ops.sim_card LIKE 'imsi';"
          mysql -h 127.0.0.1 -uroot -proot -e "SHOW COLUMNS FROM iot_sim_ops.sim_purchase LIKE 'product_id';"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/mock-fastapi/requirements.txt
            api/mock-fastapi/requirements-dev.txt
      - name: Install API test dependencies
        run: python -m pip install -r api/mock-fastapi/requirements.txt -r api/mock-fastapi/requirements-dev.txt
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium
      - name: Real MySQL HTTP and race regression
        env:
          IOT_TEST_DB_ISOLATED: '1'
          IOT_TEST_DB_NAME: iot_sim_ops
          IOT_TEST_DB_HOST: 127.0.0.1
          IOT_TEST_DB_PORT: '3306'
          IOT_TEST_DB_USER: root
          IOT_TEST_DB_PASS: root
        run: python -m pytest -q tests/test_db_integration.py
      - name: Real browser purchase and stale-response regression
        env:
          IOT_TEST_DB_ISOLATED: '1'
          IOT_TEST_DB_NAME: iot_sim_ops
          IOT_TEST_DB_HOST: 127.0.0.1
          IOT_TEST_DB_PORT: '3306'
          IOT_TEST_DB_USER: root
          IOT_TEST_DB_PASS: root
        run: python -m pytest -q tests/test_browser_integration.py
