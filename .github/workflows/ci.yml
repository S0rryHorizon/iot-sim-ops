
name: CI
on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/mock-fastapi/requirements.txt
            api/mock-fastapi/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r api/mock-fastapi/requirements.txt \
            -r api/mock-fastapi/requirements-dev.txt
      - name: Compile and test
        run: |
          python -m compileall -q api/mock-fastapi
          python -m pytest -q

  db-migrate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: iot_sim_ops
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot || exit 1"
          --health-interval=10s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            if mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Apply migrations
        run: |
          for migration in \
            db/migrations/V001__init_schema.sql \
            db/migrations/V002__seed_demo.sql \
            db/migrations/V005__user_and_ownership.sql \
            db/migrations/V006__seed_demo_users_and_assign_sims.sql \
            db/migrations/V007__add_sim_purchase_usage.sql \
            db/migrations/V008__add_imsi_to_sim_card.sql \
            db/migrations/V009__purchase_price_and_product.sql; do
            mysql -h 127.0.0.1 -uroot -proot iot_sim_ops < "$migration"
          done
      - name: Sanity checks
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "SELECT COUNT(*) 'sim_cards' FROM iot_sim_ops.sim_card;"
          mysql -h 127.0.0.1 -uroot -proot -e "SELECT COUNT(*) 'users' FROM iot_sim_ops.user_account;"
          mysql -h 127.0.0.1 -uroot -proot -e "SHOW COLUMNS FROM iot_sim_ops.sim_card LIKE 'imsi';"
          mysql -h 127.0.0.1 -uroot -proot -e "SHOW COLUMNS FROM iot_sim_ops.sim_purchase LIKE 'product_id';"
